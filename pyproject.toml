[project]
name = "basis-test-task"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.2",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88