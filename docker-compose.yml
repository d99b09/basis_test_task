services:
  postgres:
    container_name: basis-test-task-postgres
    image: dockerhub.timeweb.cloud/library/postgres:18-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    container_name: basis-test-task-rabbitmq
    image: dockerhub.timeweb.cloud/library/rabbitmq:4.2-management-alpine
    hostname: rabbitmq
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    container_name: basis-test-task-api
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  outbox_publisher:
    container_name: basis-test-task-outbox-publisher
    build:
      context: .
    command: ["python", "-m", "app.workers.outbox_publisher"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
