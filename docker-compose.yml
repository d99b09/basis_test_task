services:
  postgres:
    image: dockerhub.timeweb.cloud/library/postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: dockerhub.timeweb.cloud/library/rabbitmq:4.2-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    env_file:
      - .env
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  migrations:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    volumes:
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy

  api:
    restart: unless-stopped
    build:
      context: .
    env_file:
      - .env
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  outbox_publisher:
    build:
      context: .
    command: ["python", "-m", "app.workers.outbox_publisher"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  consumer:
    build:
      context: .
    command: ["python", "-m", "app.workers.consumer"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
