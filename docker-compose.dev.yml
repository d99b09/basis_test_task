services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app

  outbox_publisher:
    command: ["watchfiles", "--filter", "python", "python -m app.workers.outbox_publisher", "/app/app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app

  consumer:
    command: ["watchfiles", "--filter", "python", "python -m app.workers.consumer", "/app/app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app
